<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Forbidden Stars — ArcEngine</title>
    <link rel="stylesheet" href="js/fs/FSUI.css">
    <meta name="theme-color" content="#0b1117">
    <script src="libs/simplex-noise.js"></script>
    <script src="libs/babylon.js"></script>
    <script src="libs/babylonjs.loaders.min.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #222;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        #world3d {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
            touch-action: none;
        }
        #loading-screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 16px;
            background: #222;
            z-index: 1000;
        }
        .loading-text {
            font: 14px system-ui, sans-serif;
            color: #c8d0d8;
            text-align: center;
            min-height: 1em;
        }
        .loading-bar {
            width: min(220px, 70vw);
            height: 10px;
            background: #444;
            border-radius: 5px;
            overflow: hidden;
        }
        .loading-progress {
            height: 100%;
            width: 0%;
            background: #7cc0c7;
            transition: width 0.3s ease;
        }
    #fs-build{position:fixed;right:8px;bottom:4px;z-index:99999;font:10px/1 ui-monospace,monospace;color:#ffffff40;pointer-events:none;user-select:none}
    </style>
</head>
<body>
    <canvas id="world3d"></canvas>
    <div id="loading-screen">
        <div class="loading-bar"><div class="loading-progress"></div></div>
        <div class="loading-text"></div>
    </div>

    <script src="js/Debug3D.js"></script>
    <script src="js/UI.js"></script>
    <script src="js/Game.js"></script>
    <!-- Forbidden Stars: the data, the rules, the network, the board and the interface -->

        // A long tap and RMB must not open the browser menu.
        document.addEventListener('contextmenu', e => e.preventDefault());

<div id="fs-build" title="Хэш коммита, который отдаёт этот сервер">__GIT_COMMIT__</div>
